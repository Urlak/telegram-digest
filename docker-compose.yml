services:
  telegram-digest:
    build: .
    container_name: telegram-digest
    restart: unless-stopped
    ports:
      - "8041:8000"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
